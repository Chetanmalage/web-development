<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

    
    </style>
</head>

<body>
    <main>
        <section id="registration">
            <h2>

                Student Registration Form

            </h2>
            <form action="">
                <label for="name">Enter Your Name: </label>
                <input type="text" name="name" id="name" placeholder="Enter Full Name" required>
                <br>
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" required placeholder="Enter Email">
                <br>
                <label for="password">Password:</label>
                <input type="password" name="password" required id="password" placeholder="Enter Password">
                <br>
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Confirm Password"
                    required>
                <br>

                <label for="phone">Phone Number: </label>
                <input type="tel" name="phone" id="phone" placeholder="Mobile number">

                <br>
                <label for="dob">Date of Birth: </label>
                <input type="date" name="dob" id="dob" placeholder="Date of Birth">

                <br>
                <label>Gender: </label>
                <label for="male">Male</label>
                <input type="radio" name="gender" id="male">
                <label for="female">Female</label>
                <input type="radio" name="gender" id="female">
                <label for="other">Other</label>
                <input type="radio" name="gender" id="other">
                <br>

                <label for="skills">Skills:</label>
                <label for="java">Java</label>
                <input type="checkbox" name="java" id="java">
                <label for="python">Python</label>
                <input type="checkbox" name="python" id="python">
                <label for="dsa">DSA</label>
                <input type="checkbox" name="dsa" id="dsa">
                <br>

                <label for="city">City:</label>
                <select name="city" id="city">
                    <option value="solapur">
                        Solapur
                    </option>

                    <option value="pune">
                        Pune
                    </option>

                    <option value="mumbai">
                        Mumbai
                    </option>

                </select>

                <br>

                <label for="address">Address:</label>
                <textarea name="address" id="address" placeholder="Enter Address"></textarea>

                <br>

                <label for="resume">Resume:</label>
                <input type="file" name="resume" id="resume">
                <br>
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </form>
        </section>
    </main>

</body>

</html>
